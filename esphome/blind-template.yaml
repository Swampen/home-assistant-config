globals:
  - id: open_position_${id}
    type: int
    initial_value: "${open_position}"
    restore_value: true
  - id: current_position_${id}
    type: int
    initial_value: "0"
    restore_value: true

esp32:
  board: wemos_d1_mini32

esphome:
  name: balcony-blinds-v2
  friendly_name: Balcony Blinds v2
  on_boot:
    - tmc2209.configure:
        id: driver_${id}
        microsteps: ${microsteps}
        interpolation: false
    - tmc2209.stallguard:
        id: driver_${id}
        threshold: 50
    - tmc2209.currents:
        id: driver_${id}
        standstill_mode: freewheeling
        irun: ${irun}
        ihold: ${ihold}
        tpowerdown: 0
        iholddelay: 0
    - stepper.report_position:
        id: driver_${id}
        position: !lambda "return id(current_position_${id});"
    - stepper.set_target:
        id: driver_${id}
        target: !lambda "return id(current_position_${id});"

external_components:
  - source: github://slimcdk/esphome-custom-components
    components: [ tmc2209_hub, tmc2209, stepper ]

stepper:
  - platform: tmc2209
    id: driver_${id}
    tmc2209_hub_id: hub
    max_speed: ${max_speed} steps/s
    acceleration: ${acceleration}
    deceleration: ${deceleration}
    address: ${address}
    rsense: 110 mOhm
    vsense: False
    analog_current_scale: False
    enn_pin: ${enn_pin}
    index_pin: ${index_pin}
    diag_pin: ${diag_pin}
    on_stall:
      - logger.log: "Motor stalled!"
      - stepper.stop: driver_${id}

