substitutions:
  devicename: dehumidifier
  friendly_name: Dehumidifier

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}

esp8266:
  board: esp_wroom_02

logger:

api:
  encryption:
    key: !secret dehumidifier_api_key
  on_client_connected:
    then:
      - delay: 2s
      - lambda: |-
          id(tuyadevice).set_boolean_datapoint_value(101, true);
          id(tuyadevice).set_boolean_datapoint_value(102, true);
      - delay: 1s
      - lambda: |-
          id(tuyadevice).set_enum_datapoint_value(2, 0);

ota:
  - platform: esphome
    password: !secret dehumidifier_api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Not compatible with bluetooth_proxy
  # power_save_mode: NONE
  manual_ip:
    static_ip: 192.168.20.205
    gateway: 192.168.20.1
    subnet: 255.255.255.0

  ap:
    ssid: "${friendly_name} Fallback Hotspot"
    password: !secret fallback_ap_password

captive_portal:

tuya:
  id: tuyadevice
  on_datapoint_update:
    - sensor_datapoint: 2
      datapoint_type: enum
      then:
        - lambda: |-
            if (x == 1){
              id(high_fan_speed).publish_state(false);
            }
            else {
              id(high_fan_speed).publish_state(true);
            }

uart:
  tx_pin: GPIO15
  rx_pin: GPIO13
  baud_rate: 9600

binary_sensor:
  - platform: tuya
    name: Water Sensor
    sensor_datapoint: 12
  - platform: tuya
    name: Filter Sensor
    sensor_datapoint: 103

switch:
  - platform: template
    id: high_fan_speed
    name: High Fan Speed
    turn_on_action:
      - lambda: |-
          // Adjusting fan speed is only available when it is turned ON
          if (!id(power).state){
            id(tuyadevice).set_boolean_datapoint_value(101, true);
          }
          id(tuyadevice).set_enum_datapoint_value(2, 0);
    turn_off_action:
      - lambda: |-
          id(tuyadevice).set_enum_datapoint_value(2,1);

  - platform: tuya
    id: power
    name: Power
    switch_datapoint: 101

  - platform: tuya
    name: Dehumidify
    id: dehumidify
    switch_datapoint: 102
