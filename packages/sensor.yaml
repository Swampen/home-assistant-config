---
# Sensors are a basic platform component in Home Assistant.
# They monitor the states and conditions of a variety of entities.
#
# https://www.home-assistant.io/integrations/sensor
sensor:
  # https://www.home-assistant.io/integrations/time_date/
  - platform: time_date
    display_options:
      - "time"
      - "date"
      - "time_date"

  # https://github.com/custom-components/nordpool
  - platform: nordpool
    region: NO1
    precision: 4

  # https://www.home-assistant.io/integrations/integration/
  - platform: integration
    name: Office Heater Consumption Sum
    unique_id: office_heater_consumption_sum
    source: sensor.office_heater_current_power
    unit_prefix: k
    unit_time: h
    method: trapezoidal

  - platform: rest
    name: Yr Rain Next 90 Minutes
    unique_id: yr_rain_next_90_minutes
    resource: "https://www.yr.no/api/v0/locations/10-1013622/forecast/now?language=en"
    scan_interval: 300
    timeout: 20
    value_template: "{{ value_json.status.code }}"
    json_attributes:
      - created
      - update
      - radarIsDown
      - precipitationForecastDescription
      - points

  - platform: entur_public_transport
    number_of_departures: 8
    show_on_map: true
    stop_ids:
      - "NSR:StopPlace:58198"
