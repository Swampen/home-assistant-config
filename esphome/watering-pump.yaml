substitutions:
  devicename: watering-pump
  friendly_name: Watering Pump

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  # platformio_options:
  #   board_build.f_flash: 40000000L
  #   board_build.flash_mode: dio
  #   board_build.flash_size: 4MB

esp32:
  board: esp32-c3-devkitm-1
# esp32:
#   variant: ESP32C3
#   board: esp32-c3-devkitm-1
#   framework:
#     type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret watering_pump_api_key

ota:
  - platform: esphome
    password: !secret watering_pump_api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.20.196
    gateway: 192.168.20.1
    subnet: 255.255.255.0
  ap:
    ssid: "${friendly_name} Fallback Hotspot"
    password: !secret fallback_ap_password

captive_portal:

status_led:
  pin: GPIO0

binary_sensor:
  - platform: gpio
    pin: GPIO3
    name: Button A
  - platform: gpio
    pin: GPIO7
    name: Button B


switch:
  - platform: gpio
    id: a
    name: Pump A
    pin: GPIO2
  - platform: gpio
    id: b
    name: Pump B
    pin: GPIO1
