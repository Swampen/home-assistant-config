esphome:
  name: fan
  friendly_name: Fan

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip: 
    static_ip: 192.168.20.199
    gateway: 192.168.20.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Balcony-Blinds-V2"
    password: "zEHWSV3DXV9r"

button:
  - platform: output
    name: Power Toggle
    output: powerOutput
    icon: mdi:power
    duration: 150ms    
  - platform: output
    name: Speed 
    icon: mdi:fan
    output: speed
    duration: 150ms
  - platform: output
    name: Oscillate 
    icon: mdi:arrow-oscillating
    output: oscillate
    duration: 150ms

output:
  - platform: gpio
    pin: D1
    id: powerOutput
    inverted: True
  - platform: gpio
    pin: D2
    id: speed
    inverted: True
  - platform: gpio
    pin: D3
    id: oscillate
    inverted: True