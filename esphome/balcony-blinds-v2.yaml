substitutions:
  device_name: Balcony Blinds v2

packages:
  left_cover: !include
    file: blind-template.yaml
    vars:
      id: right
      cover_name: Right
      address: 0x00
      enn_pin: GPIO21
      index_pin: GPIO26
      diag_pin: GPIO18
      ihold: 2 #4
      irun: 4 #16
      microsteps: 8
      max_speed: 1000
      acceleration: 250
      deceleration: 500
      open_position: "19650"
  right_cover: !include
    file: blind-template.yaml
    vars:
      id: left
      cover_name: Left
      address: 0x01
      enn_pin: GPIO5
      index_pin: GPIO19
      diag_pin: GPIO23
      ihold: 4 #2
      irun: 16 #4
      microsteps: 8
      max_speed: 1000
      acceleration: 250
      deceleration: 500
      open_position: "19650"

external_components:
  - source: github://slimcdk/esphome-custom-components
    components: [ tmc2209_hub, tmc2209, stepper ]

esp32:
  board: wemos_d1_mini32

logger:

api:
  encryption:
    key: "qkPbd0Z2yKnR9SSWDa1wGzKnHhGIx2Vtn7DRMGtd8cw="

ota:
  - platform: esphome
    password: "09f7902922f900df2d2f6b97bcff55d3"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip: 
    static_ip: 192.168.20.198
    gateway: 192.168.20.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Balcony-Blinds-V2"
    password: "zEHWSV3DXV9r"

captive_portal:

uart:
  id: tmc_comms
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 500000 

tmc2209_hub:
  id: hub
  uart_id: tmc_comms

