          }} finished'
        message: '{{trigger.event}}'
      enabled: true
      action: notify.send_message
      target:
        entity_id: notify.hanbit_desktop
  - data:
      cache: false
      entity_id: media_player.living_room
      message: The {{ trigger.from_state.attributes.friendly_name.split(' State')[0]
        }} has finished running
    enabled: false
    action: tts.google_translate_say
