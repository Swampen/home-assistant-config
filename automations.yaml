  description: ''
  triggers:
  - entity_id:
    - sensor.washing_machine_washer_machine_state
    to: stop
    from: run
    trigger: state
    id: washer
  - entity_id:
    - select.dryer
    to: stop
    from: run
    trigger: state
    id: dryer
  conditions: []
  actions:
  - if:
    - condition: state
      entity_id: person.ole_martin
      state: home
    then:
    - data:
        title: '{{ trigger.from_state.attributes.friendly_name.split('' State'')[0]
          }} finished'
        message: '{{ trigger.event }}'
      enabled: true
      action: notify.send_message
      target:
        entity_id: notify.ole_martin_desktop
  - if:
    - condition: state
      entity_id: person.hanbit
      state: home
    then:
