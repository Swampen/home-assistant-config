esphome:
  name: fan
  friendly_name: Fan

esp8266:
  board: d1_mini

# Enable logging
logger:
  baud_rate: 0

# Enable Home Assistant API
api:
  encryption:
    key: !secret fan_api_key

ota:
  - platform: esphome
    password: !secret fan_api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.20.193
    gateway: 192.168.20.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Fan Fallback Hotspot"
    password: !secret fallback_ap_password

captive_portal:

uart:
  id: uart_1
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 2400
  debug:
    direction: BOTH
    dummy_receiver: true
    after:
      delimiter: "\n"
    sequence:
      - lambda: UARTDebug::log_string(direction, bytes);

button:
  - platform: template
    name: test
    on_press: 
      - uart.write:
          id: uart_1
          data: [0x00, 0xC0, 0xC0, 0xC0, 0xC0, 0x00, 0x00, 0x00, 0xC0]
