- id: dev_washer_completion
  alias: Dev washer completion
  description: Retain confirmed Finish until Done or a new active wash stage. Does
    not control the washer.
  triggers:
  - trigger: state
    entity_id: sensor.washing_machine_washer_job_state
    to:
    - air_wash
    - ai_rinse
    - ai_spin
    - ai_wash
    - cooling
    - delay_wash
    - drying
    - pre_wash
    - rinse
    - spin
    - wash
    - weight_sensing
    - freeze_protection
    id: active
  - trigger: state
    entity_id: sensor.washing_machine_washer_job_state
    to: finish
    id: finish
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: active
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.dev_washer_cycle_status
        data:
          option: running
    - conditions:
      - condition: trigger
        id: finish
      - condition: state
        entity_id: input_select.dev_washer_cycle_status
        state: running
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.dev_washer_finished_at
        data:
          timestamp: '{{ as_timestamp(trigger.to_state.last_changed) }}'
      - action: input_select.select_option
        target:
          entity_id: input_select.dev_washer_cycle_status
        data:
          option: finished
  mode: queued
- id: dryer_completion
  alias: Dryer completion
  description: Retain confirmed finished phase until Done or a new drying stage. Wrinkle
    prevention does not clear completion. Does not control the dryer.
  triggers:
  - trigger: state
    entity_id: sensor.dryer_job_state
    to:
    - cooling
    - delay_wash
    - drying
    - refreshing
    - weight_sensing
    - dehumidifying
    - ai_drying
    - sanitizing
    - internal_care
    - freeze_protection
    - continuous_dehumidifying
    - thawing_frozen_inside
    id: active
  - trigger: state
    entity_id: sensor.dryer_job_state
    to: finished
    id: finish
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: active
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.dryer_cycle_status
        data:
          option: running
    - conditions:
      - condition: trigger
        id: finish
      - condition: state
        entity_id: input_select.dryer_cycle_status
        state: running
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.dryer_finished_at
        data:
          timestamp: '{{ as_timestamp(trigger.to_state.last_changed) }}'
      - action: input_select.select_option
        target:
          entity_id: input_select.dryer_cycle_status
        data:
          option: finished
  mode: queued
