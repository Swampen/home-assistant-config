substitutions:
  device_name: Balcony Blinds v2

globals:
  - id: open_position_cover_1
    type: int
    initial_value: "0"
    restore_value: true
  - id: current_position_cover_1
    type: int
    initial_value: "0"
    restore_value: true
       
packages:
  left_cover: !include
    file: blind-template.yaml
    vars:
      conver_name: Left Cover
      address: 0x00
      enn_pin: GPIO21
      index_pin: GPIO26
      diag_pin: GPIO18

external_components:
  - source: github://slimcdk/esphome-custom-components
    components: [ tmc2209_hub, tmc2209, stepper ]

esphome:
  name: balcony-blinds-v2
  friendly_name: Balcony Blinds v2
  on_boot:
    - tmc2209.configure:
        id: driver1
        microsteps: 8
        interpolation: false
        #tcool_threshold: 400
    - tmc2209.stallguard:
        id: driver1
        threshold: 25
    - tmc2209.currents:
        id: driver1
        standstill_mode: normal
        irun: 16
        ihold: 2
        tpowerdown: 0
        iholddelay: 0
    - stepper.report_position:
        id: driver1
        position: !lambda return id(current_position_cover_1);
    - stepper.set_target:
        id: driver1
        target: !lambda return id(current_position_cover_1);
    # - stepper.report_position:
    #     id: driver1
    #     position: !lambda "return id(current_position_cover_1);"
    # - stepper.set_target:
    #     id: driver1
    #     target: !lambda "return id(current_position_cover_1);"

esp32:
  board: wemos_d1_mini32

logger:

api:
  encryption:
    key: "qkPbd0Z2yKnR9SSWDa1wGzKnHhGIx2Vtn7DRMGtd8cw="

ota:
  - platform: esphome
    password: "09f7902922f900df2d2f6b97bcff55d3"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip: 
    static_ip: 192.168.20.198
    gateway: 192.168.20.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Balcony-Blinds-V2"
    password: "zEHWSV3DXV9r"

captive_portal:

uart:
  id: tmc_comms
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 500000 #9600

script:
  - id: move_stepper
    parameters:
      stepper_id: int
      steps: int
    then:
      - lambda: |-
          static std::map<int, Stepper*> stepper_map {
            { 1, id(driver1) }
          };
          auto target = stepper_map.find(stepper_id);
          if (target != stepper_map.end()){
            auto stepper = target->second;
            stepper->set_target(stepper->current_position + steps);
          }  

tmc2209_hub:
  id: hub1
  uart_id: tmc_comms

stepper:
  - platform: tmc2209
    id: driver1
    tmc2209_hub_id: hub1
    max_speed: 5000 steps/s
    acceleration: 2500
    deceleration: 500
    address: 0x00
    rsense: 110 mOhm
    vsense: False
    analog_current_scale: False
    enn_pin: GPIO21
    index_pin: GPIO26
    diag_pin: GPIO18
    on_stall:
      - logger.log: "Motor 1 stalled!"
      - stepper.stop: driver1

  # - platform: tmc2209
  #   id: driver2
  #   tmc2209_hub_id: hub1
  #   max_speed: 300 steps/s
  #   acceleration: 150
  #   deceleration: 150
  #   address: 0x01
  #   config_dump_include_registers: true
  #   vsense: False
  #   analog_current_scale: False
  #   enn_pin: GPIO5
  #   index_pin: GPIO19
  #   diag_pin: GPIO23
  #   on_stall:
  #     - logger.log: "Motor 2 stalled!"
  #     - stepper.stop: driver2

number:
  - platform: template
    name: Target position 1
    min_value: -10000
    max_value: 10000
    step: 1000
    lambda: return id(driver1)->current_position;
    update_interval: 1s
    set_action:
      - stepper.set_target:
          id: driver1
          target: !lambda "return x;"

sensor:
  - platform: tmc2209
    tmc2209_id: driver1
    type: motor_load
    name: Motor load 1
    update_interval: 250ms

  - platform: template
    name: Stallguard result 1
    lambda: return id(driver1)->read_register(SG_RESULT);

  - platform: template
    entity_category: DIAGNOSTIC
    name: "Open position 1"
    accuracy_decimals: 0
    unit_of_measurement: "steps"
    lambda: !lambda "return id(open_position_cover_1);"
    update_interval: 1s

  - platform: template
    entity_category: DIAGNOSTIC
    name: "Current stepper position 1"
    accuracy_decimals: 0
    unit_of_measurement: "steps"
    lambda: !lambda "return id(driver1)->current_position;"
    update_interval: 1s

  - platform: template
    entity_category: DIAGNOSTIC
    name: "Current position 1"
    accuracy_decimals: 0
    unit_of_measurement: "steps"
    lambda: !lambda "return id(current_position_cover_1);"
    update_interval: 1s

cover:
  - platform: template
    id: cover_x
    has_position: true
    optimistic: true
    name: "${device_name} Left Cover"
    open_action:
      - stepper.set_target:
          id: driver1
          target: !lambda "return id(open_position_cover_1);"
      - globals.set:
          id: current_position_cover_1
          value: !lambda "return id(open_position_cover_1);"
    close_action:
      - stepper.set_target:
          id: driver1
          target: 0
      - globals.set:
          id: current_position_cover_1
          value: "0"
    stop_action:
      - stepper.stop: driver1
    position_action:
      - stepper.set_target:
          id: driver1
          target: !lambda "return id(open_position_cover_1) * pos;"
      - globals.set:
          id: current_position_cover_1
          value: !lambda "return id(open_position_cover_1) * pos;"

button:
  - platform: template
    name: Set 1 Closed
    entity_category: CONFIG 
    on_press: 
      - stepper.report_position:
          id: driver1
          position: 0
      - stepper.set_target:
          id: driver1
          target: 0
  - platform: template
    name: Set 1 Open
    entity_category: CONFIG 
    on_press: 
      - globals.set:
          id: open_position_cover_1
          value: !lambda "return id(driver1)->current_position;"
  - platform: template
    name: Stop 1
    entity_category: CONFIG 
    on_press:
      - stepper.stop: driver1
  - platform: template
    name: 1600 Steps forward 1
    entity_category: config 
    on_press:
      - script.execute:
          id: move_stepper
          stepper_id: 1
          steps: 1600
  - platform: template
    name: 1600 Steps backward 1
    entity_category: config 
    on_press:
      - script.execute:
          id: move_stepper
          stepper_id: 1
          steps: -1600